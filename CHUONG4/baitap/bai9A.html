<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language="JavaScript">
        var SoLuong, x;
        var DS = new Array(100); //Khai báo mảng DS, có thể lưu tối đa 100 phần tửtử
        SoLuong = prompt("Số người cần nhập:", 5);
        for (i=0; i<SoLuong; i++)
    {
        DS[i] = prompt("Nhập họ và tên:", "");
    }
    //Gọi hàm sort của đối tượng mảng DS để sắp xếpxếp
    DS.sort();
    //Hiển thị kết quả sau khi sắp (sortsort)
    document.write("<h1>Danh sách đã sắp xếp là</h1>");
    for (x in DS)
    {
        document.write(DS[x]);
        document.write("<BR>");
    }
    </script>
    
</body>
</html>
