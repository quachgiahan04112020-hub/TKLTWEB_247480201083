<html>
  <head>
    <title>Tinh tuoi</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  </head>
  <body>
    <script language="JavaScript">
      var D = new Date();
      var NamSinh, NamHienTai;
      NamHienTai = D.getFullYear(); // Lấy năm hiện tại (4 chữ số)

      do {
        NamSinh = prompt("Bạn sinh năm bao nhiêu : ", "");
        NamSinh = parseInt(NamSinh); // Chuyển chuỗi nhập vào thành số nguyên
      } while (isNaN(NamSinh) || NamSinh > NamHienTai); // Nhập lại nếu không phải số hoặc năm sinh > năm hiện tại

      var Tuoi = NamHienTai - NamSinh;
      alert("Tuổi của bạn bây giờ là : " + Tuoi);
    </script>
  </body>
</html>
