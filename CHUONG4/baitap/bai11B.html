<HTML>
    <HEAD>
        <TITLE>Thay mau nen bang click chuot</TITLE>
        <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    </HEAD>
    
    <BODY>
        <h2>Thay đổi màu nền sử dụng đối tượng document</h2>
    
        <INPUT type="button"
               name="MauXanhDuong"
               value="Màu xanh dương"
               onClick="document.bgColor='blue';">
    
        <INPUT type="button"
               name="MauXanhLa"
               value="Màu xanh lá"
               onClick="document.bgColor='green';">
    
        <INPUT type="button"
               name="MauDo"
               value="Màu đỏ"
               onClick="document.bgColor='red';">
    </BODY>
    </HTML>
