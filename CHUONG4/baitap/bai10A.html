<HTML>
    <HEAD>
        <TITLE>Minh họa đưa câu lệnh JavaScript</TITLE>
        <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    </HEAD>
    
    <BODY>
    
        <H2>Minh họa đưa câu lệnh JavaScript vào nút</H2>
    
        <INPUT type="button" name="Nut1" value="Nút 1"
            onClick="alert('Hello world');">
    
        <INPUT type="button" name="Nut2" value="Nút 2"
            onClick="document.write('Welcome to JavaScript');">
    
        <INPUT type="button" name="Nut3" value="Nút 3"
            onClick="var x,y; x=10; y=20; alert('Tổng là : ' + (x+y));">
    
        <INPUT type="button" name="Nut4" value="Nút 4"
            onClick="alert('Bạn đã nhấn nút 4');">
    
        <INPUT type="button" name="Nut5" value="Nút 5"
            onClick="alert('Bạn đã nhấn nút 5');">
    
    </BODY>
    </HTML>
