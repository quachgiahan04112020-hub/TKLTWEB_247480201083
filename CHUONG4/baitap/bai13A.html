<HTML>
    <HEAD>
        <TITLE>Thay đổi giá trị của thuộc tính</TITLE>
        <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    </HEAD>
    
    <BODY>
    
        <h2>Hãy nhập hai số và click vào nút Tính tổng</h2>
    
        <INPUT type="text" name="SoHang1"> +
    
        <INPUT type="text" name="SoHang2"> =
    
        <INPUT type="text" name="KetQua">
    
        <BR><BR>
    
        <INPUT type="button"
               name="TinhTong"
               value="Tính tổng"
               onClick="document.getElementsByName('KetQua')[0].value =
                        Number(document.getElementsByName('SoHang1')[0].value) +
                        Number(document.getElementsByName('SoHang2')[0].value);">
    
    </BODY>
    </HTML>
