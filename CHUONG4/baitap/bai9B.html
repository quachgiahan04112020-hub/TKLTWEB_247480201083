<HTML>

    <TITLE>Thiết bị văn phòng</TITLE>
    
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    
    <BODY>
    
    <script language="JavaScript">
    
    var SoLuong, i;
    var DS = new Array(100);
    
    SoLuong = prompt("Bạn cần nhập bao nhiêu thiết bị: ", 5);
    
    for (i = 0; i < SoLuong; i++)
    {
        DS[i] = prompt("Nhập vào tên thiết bị: ", "");
    }
    
    document.write("<h1>Danh sách thiết bị Computer</h1>");
    
    document.write("<table border='1'>");
    
    document.write("<tr>");
    document.write("<th>STT</th>");
    document.write("<th>Tên thiết bị</th>");
    document.write("</tr>");
    
    for (i = 0; i < SoLuong; i++)
    {
        if (DS[i].toLowerCase() == "computer")
        {
            document.write("<tr>");
            document.write("<td>" + (i + 1) + "</td>");
            document.write("<td>" + DS[i] + "</td>");
            document.write("</tr>");
        }
    }
    
    document.write("</table>");
    
    </script>
    
    </BODY>
    
    </HTML>
