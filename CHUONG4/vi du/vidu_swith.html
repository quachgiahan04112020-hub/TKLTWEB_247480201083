<body>
    
    <script>
    document.write("In ra màn hình <br> ");

    let nam = 4;

    switch (nam) {
        case 1:
            document.write("Học đại cương");
            break;

        case 2:
            document.write("Học cơ sở ngành");
            break;

        case 3:
            document.write("Học chuyên ngành");
            break;

        case 4:
            document.write("Làm khóa luận");
            break;

        default:
            document.write("Ra trường");
    }
</script>
